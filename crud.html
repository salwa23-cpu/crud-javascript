<!DOCTYPE html>
<html lang="id">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>CRUD Nama Siswa</title>
</head>
<body>
 <h1>Daftar Nama Siswa</h1>
 <input type="text" id="namaInput" placeholder="Masukkan nama siswa">
 <button id="addBtn">Tambah</button>
 <ul id="siswaList"></ul>
 <script src="let siswa = [];
const input = document.getElementById("namaInput");
const list = document.getElementById("siswaList");
const addBtn = document.getElementById("addBtn");
addBtn.addEventListener("click", tambahSiswa);
function renderSiswa() {
 list.innerHTML = "";
 siswa.forEach((s, i) => {
 const li = document.createElement("li");
 li.textContent = s;
 li.innerHTML += `
 <button onclick="editSiswa(${i})">Edit</button>
 <button onclick="hapusSiswa(${i})">Hapus</button>
 `;
 list.appendChild(li);
 });
}
   function tambahSiswa() {
 const nama = input.value.trim();
 if (nama) {
 siswa.push(nama);
 input.value = "";
 renderSiswa();
 } else {
 alert("Nama tidak boleh kosong!");
 }
}
function editSiswa(i) {
 const namaBaru = prompt("Edit nama siswa:", siswa[i]);
 if (namaBaru) {
 siswa[i] = namaBaru;
 renderSiswa();
 }
}
function hapusSiswa(i) {
 siswa.splice(i, 1);
 renderSiswa();
}"></script>
</body>
</html>
